name: Publish verified leaderboard
on:
  push:
    branches: [main]
    paths:
      - 'submissions/**'
      - 'arena/**'
      - 'verify.py'
      - 'pilot_instances.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m arena.leaderboard
      - name: Commit leaderboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LEADERBOARD.md leaderboard.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified leaderboard'
            git push
          fi
