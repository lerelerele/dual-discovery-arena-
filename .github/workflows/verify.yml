name: Verify submissions
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m arena.leaderboard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaderboard-preview
          path: |
            LEADERBOARD.md
            leaderboard.json
