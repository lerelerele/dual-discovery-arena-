name: Build public ranking dashboard
on:
  push:
    branches: [main]
    paths:
      - 'submissions/**'
      - 'arena/**'
      - 'verify.py'
      - 'pilot_instances.json'
      - 'confirmations.json'
      - 'impact_instances.json'
      - 'dashboard/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m arena.leaderboard
      - run: |
          mkdir -p _site
          cp dashboard/index.html _site/index.html
          cp leaderboard.json _site/leaderboard.json
          cp pilot_instances.json _site/pilot_instances.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
